<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Deck · prueba sin conectar</title><style>:root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#101119;color:#fafafa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#25203955,transparent 60%);min-height:100dvh}main{max-width:520px;margin:auto;padding:28px 22px max(24px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;color:#b6a1ff;font-weight:800}.brand span{font-size:14px;letter-spacing:2px;color:#eee}button{font:inherit;cursor:pointer;border:1px solid #343443;background:#20212c;color:#eee;border-radius:14px}header button{width:40px;height:40px;font-size:22px}.status{display:flex;gap:7px;align-items:center;font-size:12px;color:#9799ab;margin:25px 0 35px}#dot{width:7px;height:7px;background:#efab63;border-radius:50%}#dot.on{background:#81e7b5}.tag{margin-left:auto;font-size:9px;letter-spacing:1px;border:1px solid #353545;padding:5px 8px;border-radius:5px}.heading{display:flex;align-items:center;justify-content:space-between}.heading p{font-size:10px;letter-spacing:2px;color:#a29ab7;margin:0 0 8px}h1{font-size:34px;margin:0 0 24px;letter-spacing:-1px}#back{padding:8px 12px;margin-bottom:18px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.key{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(145deg,#242432,#1b1c27);box-shadow:0 5px 0 #090a10;border:1px solid #3a384d;transition:transform .12s,background .12s}.key.folder{background:linear-gradient(145deg,#332a4b,#252036);border-color:#534567}.key:active{transform:translateY(4px);box-shadow:0 1px 0 #090a10}.key:focus-visible{outline:3px solid #b7a1ff;outline-offset:3px}.key .icon{font-size:32px}.key .label{font-size:12px;max-width:95%;overflow-wrap:anywhere}.key .number{position:absolute;top:9px;left:10px;font-size:9px;color:#777687}.key .arrow{position:absolute;top:8px;right:9px;font-size:12px;color:#b9a3e6}.key:disabled{opacity:.4;cursor:default}.hint{text-align:center;font-size:11px;color:#828193;margin:25px 0}#message{min-height:36px;text-align:center;color:#c8baff;font-size:13px}footer{border-top:1px solid #2a2936;padding-top:20px;font-size:9px;color:#b4a2db;letter-spacing:1px;display:flex;justify-content:space-between}footer span{color:#666878;letter-spacing:0}dialog{max-width:400px;width:90%;background:#1c1c28;border:1px solid #504265;border-radius:20px;color:#eee;padding:24px}dialog::backdrop{background:#000a}dialog p{line-height:1.6;color:#aaaaba;font-size:14px}dialog label{display:block;font-size:12px}input{width:100%;padding:12px;border-radius:8px;background:#12121b;color:white;border:1px solid #484255;margin:8px 0 16px}dialog button{padding:11px 17px}.primary{background:#ac90ef;color:#181126;border:0}.small{font-size:11px!important}@media(max-width:350px){main{padding:20px 14px}.grid{gap:8px}.key .label{font-size:10px}.key .icon{font-size:27px}footer span{display:none}}
:root{--accent:#b7a1ff}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 26px}.actions button{font-size:12px;padding:10px 13px}.quiet{background:transparent;border-color:transparent;color:#aaa2b8;font-size:12px}.sending{opacity:.5}button:disabled{cursor:wait}dialog button{margin:4px 2px}dialog form{margin:0}dialog input{font-size:12px}[hidden]{display:none!important}
.code-input{font-size:24px!important;text-align:center;letter-spacing:4px;text-transform:uppercase}#pairStatus{color:#d0baff;font-size:13px;min-height:20px}
</style>
<main><header><div class="brand">▦ POCKET DECK</div></header><div class="status"><span class="tag">DEMO · NO CONTROLA TU PC</span></div>
<section class="heading"><div><p>PRUÉBALO SIN CONFIGURAR NADA</p><h1 id="title">Inicio</h1></div><button id="back" hidden>← Volver</button></section>
<div id="grid" class="grid"></div><p id="message" role="status" style="min-height:50px">Explora las carpetas. Los botones de acción muestran qué harían.</p>
<p class="hint">Para usarlo de verdad, abre PocketDeck.exe y vincula tu celular.</p><footer>DEMO LOCAL · NO ENVÍA ÓRDENES</footer></main>
<script>const config={"title": "Pocket Deck", "pages": {"home": {"title": "Inicio", "buttons": [{"name": "Juegos", "icon": "🎮", "folder": "games"}, {"name": "Apps", "icon": "💻", "folder": "apps"}, {"name": "Ocio", "icon": "🎧", "folder": "leisure"}, {"name": "Steam", "icon": "🚀", "action": "steam"}, {"name": "YouTube", "icon": "▶️", "action": "youtube"}, {"name": "Spotify", "icon": "🎵", "action": "spotify"}, {"name": "Explorador", "icon": "📂", "action": "explorer"}, {"name": "Bloc de notas", "icon": "📝", "action": "notepad"}, {"name": "Calculadora", "icon": "🧮", "action": "calculator"}]}, "games": {"title": "Juegos", "buttons": [{"name": "Steam", "icon": "🚀", "action": "steam"}, {"name": "Mi juego 1", "icon": "⚔️", "action": "game1"}, {"name": "Mi juego 2", "icon": "🏎️", "action": "game2"}]}, "apps": {"title": "Apps", "buttons": [{"name": "Explorador", "icon": "📂", "action": "explorer"}, {"name": "Bloc de notas", "icon": "📝", "action": "notepad"}, {"name": "Calculadora", "icon": "🧮", "action": "calculator"}, {"name": "Mi app", "icon": "💡", "action": "myapp"}]}, "leisure": {"title": "Ocio", "buttons": [{"name": "YouTube", "icon": "▶️", "action": "youtube"}, {"name": "Spotify", "icon": "🎵", "action": "spotify"}, {"name": "Twitch", "icon": "🟣", "action": "twitch"}, {"name": "Netflix", "icon": "🍿", "action": "netflix"}]}}, "actions": {"steam": {"type": "url", "target": "steam://open/main"}, "youtube": {"type": "url", "target": "https://www.youtube.com"}, "spotify": {"type": "url", "target": "https://open.spotify.com"}, "twitch": {"type": "url", "target": "https://www.twitch.tv"}, "netflix": {"type": "url", "target": "https://www.netflix.com"}, "explorer": {"type": "program", "target": "C:\\Windows\\explorer.exe"}, "notepad": {"type": "program", "target": "C:\\Windows\\System32\\notepad.exe"}, "calculator": {"type": "program", "target": "C:\\Windows\\System32\\calc.exe"}, "game1": null, "game2": null, "myapp": null}};let page='home';const $=id=>document.getElementById(id);
function render(){const p=config.pages[page];$('title').textContent=p.title;$('back').hidden=page==='home';$('grid').replaceChildren();
for(let i=0;i<9;i++){const key=p.buttons[i],b=document.createElement('button');b.className='key';b.disabled=!key;
for(const [c,t] of [['number',String(i+1).padStart(2,'0')],['icon',key?.icon||'＋'],['label',key?.name||'Disponible']]){const s=document.createElement('span');s.className=c;s.textContent=t;b.append(s);}
b.onclick=()=>{if(key.folder){page=key.folder;render();$('message').textContent='Carpeta: '+config.pages[page].title;}else{$('message').textContent='En la versión conectada, este botón abre '+key.name+' en tu PC. Aquí solo estás probando la interfaz.';}};$('grid').append(b);}}
$('back').onclick=()=>{page='home';render();$('message').textContent='Inicio';};render();</script></html>
